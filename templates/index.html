        const el = document.getElementById('briefShareMsg');
        if (!el) return;
        el.textContent = text || '';
        if (text) setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 2000);
    }

    async function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return;
        }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
    }

    async function copyBriefingMarkdown() {
        try {
            const res = await fetch(`/api/briefing.md?days=${encodeURIComponent(briefDays)}`);
            const text = await res.text();
            if (!res.ok) throw new Error(text.slice(0, 80) || '导出失败');
            await copyTextToClipboard(text);
            setBriefShareMsg('已复制 Markdown');
        } catch (err) {
            setBriefShareMsg(err.message || '复制失败');
        }
    }

    async function copyBriefingLink() {
        try {
            const url = `${location.origin}/share/briefing?days=${encodeURIComponent(briefDays)}`;
            await copyTextToClipboard(url);
            setBriefShareMsg('已复制链接');
        } catch (err) {
            setBriefShareMsg(err.message || '复制失败');
        }
    }

    async function loadBriefing() {
        syncBriefShareLinks();
        briefingBody.innerHTML = `<div class="flex flex-col items-center justify-center py-20 text-mist-400"><div class="spinner"></div><div class="text-sm">生成简报</div></div>`;
        try {
            const data = await fetchJson(`/api/briefing?days=${encodeURIComponent(briefDays)}`);
            if (data.loading) {
                briefingBody.innerHTML = `<div class="flex flex-col items-center justify-center py-20 text-mist-400"><div class="spinner"></div><div class="text-sm">数据准备中</div></div>`;
                return;
            }
            totalCountSpan.textContent = data.total_items;
            if (data.cached_at) updateTimeSpan.textContent = formatCachedTime(data.cached_at);
            renderBriefTopics(data.topics || []);
            renderBriefing(data);
        } catch (err) {
            briefingBody.innerHTML = `<div class="py-20 text-center text-sm text-red-400">${escapeHtml(err.message)}</div>`;
        }
    }

    function renderBriefTopics(topics) {
        const el = document.getElementById('briefTopics');
        if (!topics.length) {
            el.innerHTML = '<span class="text-xs text-mist-500">暂无热点议题</span>';
            return;
        }
        el.innerHTML = topics.map(t =>
            `<span class="chip hot" style="cursor:default">${escapeHtml(t.label)}<span class="count">${t.count}</span></span>`
        ).join('');
    }

    function renderBriefing(data) {
        const sections = data.sections || [];
        const earnings = data.earnings || [];
        if (!sections.length && !earnings.length) {
            briefingBody.innerHTML = `<div class="py-20 text-center text-sm text-mist-500">近 ${escapeHtml(String(data.days || 1))} 日暂无足够内容</div>`;
            return;
        }
        const briefArticles = [];
        let html = '';
        if (earnings.length) {
            html += `<section class="mb-8">
                <div class="mb-3 flex items-baseline gap-3 border-b border-white/10 pb-2">
                    <h3 class="font-display text-lg tracking-wide text-mist-50">财报速览</h3>
                    <span class="text-xs text-mist-500">${earnings.length}</span>
                </div>
                <div class="space-y-2">${earnings.map(it => {
                    const idx = briefArticles.length;
                    briefArticles.push(it);
                    return briefItemHtml(it, true, idx);
                }).join('')}</div>
            </section>`;
        }
        sections.forEach(sec => {
            html += `<section class="mb-8">
                <div class="mb-3 flex items-baseline gap-3 border-b border-white/10 pb-2">
                    <h3 class="font-display text-lg tracking-wide text-mist-50">${escapeHtml(sec.label)}</h3>
                    <span class="text-xs text-mist-500">${sec.count}</span>
                </div>
                <div class="space-y-2">${(sec.items || []).map(it => {
                    const idx = briefArticles.length;
                    briefArticles.push(it);
                    return briefItemHtml(it, false, idx);
                }).join('')}</div>
            </section>`;
        });
        briefingBody.innerHTML = html;
        briefingBody.querySelectorAll('[data-open-link]').forEach(el => {
            el.addEventListener('click', () => markRead(el.dataset.openLink, true));
        });
        briefingBody.querySelectorAll('[data-later]').forEach(btn => {
            btn.addEventListener('click', () => { toggleLater(btn.dataset.later); loadBriefing(); });
        });
        briefingBody.querySelectorAll('[data-read]').forEach(btn => {
            btn.addEventListener('click', () => { markRead(btn.dataset.read, !isRead(btn.dataset.read)); loadBriefing(); });
        });
        bindReaderTriggers(briefingBody, briefArticles);
        bindClusterToggles(briefingBody);
    }

    function briefItemHtml(it, showCompany, readerIdx) {
        const link = it.link || '';
        const read = isRead(link);
        const later = isLater(link);
        const company = showCompany && it.company
            ? `<span class="text-xs font-medium text-brass">${escapeHtml(it.company)}</span>` : '';
        return `
            <article class="rounded-xl border border-white/5 bg-ink-800/40 px-3.5 py-3 ${read ? 'opacity-50' : ''} ${later ? 'ring-1 ring-brass/25' : ''}">
                <div class="mb-1.5 flex flex-wrap items-center gap-2">
                    ${company}
                    <span class="text-xs text-mist-400">${escapeHtml(it.source_cn || it.source || '')}</span>
                </div>
                <a class="text-sm font-medium leading-snug text-mist-50 hover:text-brass" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer" data-open-link="${escapeHtml(link)}">${escapeHtml(it.title)}</a>
                ${summaryBlock(it.description, readerIdx)}
                ${clusterTimelineHtml(it, `brief-rel-${readerIdx}`)}
                <div class="mt-2.5 flex flex-wrap items-center justify-between gap-2">
                    <span class="text-[11px] text-mist-500">${escapeHtml(it.published || '—')}</span>
                    <div class="flex gap-1.5">
                        <button type="button" class="${actionBtn(later)}" data-later="${escapeHtml(link)}">稍后</button>
                        <button type="button" class="${actionBtn(read)}" data-read="${escapeHtml(link)}">已读</button>
                    </div>
                </div>
            </article>`;
    }

    function fillAdminSelects() {
        const dt = document.getElementById('afDocType');
        const dm = document.getElementById('afDomain');
        const docLabels = { '': '自动推断', ...Object.fromEntries(DOC_TYPES.filter(t => t.id !== 'all').map(t => [t.id, t.label])) };
        const domainLabels = { '': '自动推断', ...Object.fromEntries(DOMAINS.filter(t => t.id !== 'all').map(t => [t.id, t.label])) };
        dt.innerHTML = Object.entries(docLabels).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
        dm.innerHTML = Object.entries(domainLabels).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
    }

    function bindAdmin() {
        fillAdminSelects();
        let searchTimer = null;
        document.getElementById('adminSearch').addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadAdminSources(), 280);
        });
        document.getElementById('adminOrigin').addEventListener('change', () => loadAdminSources());
        document.getElementById('adminNewBtn').addEventListener('click', () => openAdminForm(null));
        document.getElementById('afCancel').addEventListener('click', () => {
            adminForm.classList.add('hidden');
            adminEditing = null;
        });
        document.getElementById('afSave').addEventListener('click', saveAdminForm);
        document.getElementById('afTest').addEventListener('click', testAdminForm);
    }

    function openAdminForm(source) {
        adminForm.classList.remove('hidden');
        afMsg.textContent = '';
        afTestResult.classList.add('hidden');
        adminEditing = source ? source.name : null;
        const titleEl = document.getElementById('adminFormTitle');
        if (titleEl) {
            titleEl.textContent = source
                ? (source.origin === 'builtin' ? `编辑内置源 · ${source.name_cn || source.name}` : `编辑自定义源 · ${source.name_cn || source.name}`)
                : '新增自定义源';
        }
        const nameEl = document.getElementById('afName');
        nameEl.value = source ? source.name : '';
        nameEl.disabled = !!source;
        document.getElementById('afNameCn').value = source ? (source.name_cn || '') : '';
        document.getElementById('afRss').value = source ? (source.rss || '') : '';
        document.getElementById('afCountry').value = source ? (source.country || '其他') : '其他';
        document.getElementById('afCategory').value = source ? (source.category || '其他') : '其他';
        document.getElementById('afDocType').value = source ? (source.doc_type || '') : '';
        document.getElementById('afDomain').value = source ? (source.domain || '') : '';
        document.getElementById('afPriority').value = String(source ? (source.priority || 2) : 2);
        document.getElementById('afIcon').value = source ? (source.icon || '') : '';
        document.getElementById('afDesc').value = source ? (source.description || '') : '';
        adminForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function adminFormPayload() {
        return {
            name: document.getElementById('afName').value.trim(),
            name_cn: document.getElementById('afNameCn').value.trim(),
            rss: document.getElementById('afRss').value.trim(),
            country: document.getElementById('afCountry').value.trim() || '其他',
            category: document.getElementById('afCategory').value.trim() || '其他',
            doc_type: document.getElementById('afDocType').value || null,
            domain: document.getElementById('afDomain').value || null,
            priority: parseInt(document.getElementById('afPriority').value, 10) || 2,
            icon: document.getElementById('afIcon').value.trim(),
            description: document.getElementById('afDesc').value.trim(),
            enabled: true,
        };
    }

    async function saveAdminForm() {
        const payload = adminFormPayload();
        afMsg.textContent = '保存中…';
        try {
            let res;
            if (adminEditing) {
                res = await fetch(`/api/admin/sources/${encodeURIComponent(adminEditing)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
            } else {
                res = await fetch('/api/admin/sources', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
            }
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || '保存失败');
            afMsg.textContent = '已保存';
            adminForm.classList.add('hidden');
            adminEditing = null;
            await loadAdminSources();
            const stats = await (await fetch('/api/stats')).json();
            sourceCountSpan.textContent = stats.total_sources;
        } catch (err) {
            afMsg.textContent = err.message;
        }
    }

    async function testAdminForm() {
        const payload = adminFormPayload();
        afMsg.textContent = '试抓中…';
        afTestResult.classList.remove('hidden');
        afTestResult.textContent = '请求中…';
        try {
            const res = await fetch('/api/admin/sources/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (!data.ok) {
                afMsg.textContent = data.error || '试抓失败';
                afTestResult.textContent = data.error || '失败';
                return;
            }
            afMsg.textContent = `试抓成功 ${data.count} 条`;
            afTestResult.innerHTML = (data.samples || []).map(s =>
                `<div class="mb-2"><div class="text-mist-200">${escapeHtml(s.title)}</div>
                 <div class="text-mist-500">${escapeHtml(s.description || '')}</div></div>`
            ).join('') || '无条目';
        } catch (err) {
            afMsg.textContent = err.message;
            afTestResult.textContent = err.message;
        }
    }

    async function loadAdminSources() {
        adminList.innerHTML = `<div class="flex flex-col items-center justify-center py-16 text-mist-400"><div class="spinner"></div></div>`;
        try {
            const q = document.getElementById('adminSearch').value.trim();
            const origin = document.getElementById('adminOrigin').value;
            const params = new URLSearchParams({ origin });
            if (q) params.set('q', q);
            const data = await fetchJson(`/api/admin/sources?${params}`);
            adminLabels = data;
            totalCountSpan.textContent = data.total;
            renderAdminList(data.sources || []);
        } catch (err) {
            adminList.innerHTML = `<div class="py-16 text-center text-sm text-red-400">${escapeHtml(err.message)}</div>`;
        }
    }

    function renderAdminList(sources) {
        if (!sources.length) {
            adminList.innerHTML = `<div class="py-16 text-center text-sm text-mist-500">无匹配源</div>`;
            return;
        }
        const statusLabel = { ok: '正常', failing: '异常', demoted: '降权', unknown: '未知' };
        adminList.innerHTML = `
            <div class="overflow-x-auto rounded-2xl border border-white/10 bg-ink-800/50">
                <table class="w-full min-w-[720px] text-left text-xs text-mist-400">
                    <thead class="text-mist-500">
                        <tr class="border-b border-white/5">
                            <th class="px-3 py-3 font-medium">状态</th>
                            <th class="px-3 py-3 font-medium">名称</th>
                            <th class="px-3 py-3 font-medium">类型</th>
                            <th class="px-3 py-3 font-medium">国家</th>
                            <th class="px-3 py-3 font-medium">健康</th>
                            <th class="px-3 py-3 font-medium">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sources.slice(0, 200).map(s => `
                            <tr class="border-b border-white/[0.03] ${s.enabled ? '' : 'opacity-45'}">
                                <td class="px-3 py-2.5">${s.enabled ? '启用' : '停用'}</td>
                                <td class="px-3 py-2.5">
                                    <div class="text-mist-100">${escapeHtml(s.name_cn || s.name)}</div>
                                    <div class="mt-0.5 text-[10px] text-mist-500">${escapeHtml(s.origin)} · ${escapeHtml(s.name)}</div>
                                </td>
                                <td class="px-3 py-2.5">${escapeHtml(s.doc_type_label || '')}<div class="text-[10px] text-mist-500">${escapeHtml(s.domain_label || '')}</div></td>
                                <td class="px-3 py-2.5">${escapeHtml(s.country || '')}</td>
                                <td class="px-3 py-2.5">${statusLabel[s.status] || s.status}<div class="text-[10px] text-mist-500">${s.success_count}/${s.fail_count}</div></td>
                                <td class="px-3 py-2.5">
                                    <div class="flex flex-wrap gap-1">
                                        <button type="button" class="rounded-md border border-white/10 px-2 py-1 text-[11px] hover:border-brass/40 hover:text-brass" data-admin-edit="${escapeHtml(s.name)}">编辑</button>
                                        <button type="button" class="rounded-md border border-white/10 px-2 py-1 text-[11px] hover:border-brass/40 hover:text-brass" data-admin-toggle="${escapeHtml(s.name)}" data-enabled="${s.enabled ? '1' : '0'}">${s.enabled ? '禁用' : '启用'}</button>
                                        <button type="button" class="rounded-md border border-white/10 px-2 py-1 text-[11px] hover:border-brass/40 hover:text-brass" data-admin-fetch="${escapeHtml(s.name)}">抓取</button>
                                        ${s.origin === 'custom' ? `<button type="button" class="rounded-md border border-white/10 px-2 py-1 text-[11px] text-red-300/80 hover:border-red-400/40" data-admin-del="${escapeHtml(s.name)}">删除</button>` : ''}
                                    </div>
                                </td>
                            </tr>`).join('')}
                    </tbody>
                </table>
                ${sources.length > 200 ? `<div class="border-t border-white/5 px-3 py-2 text-[11px] text-mist-500">仅显示前 200 条，请缩小搜索范围</div>` : ''}
            </div>`;

        const byName = Object.fromEntries(sources.map(s => [s.name, s]));
        adminList.querySelectorAll('[data-admin-edit]').forEach(btn => {
            btn.addEventListener('click', () => openAdminForm(byName[btn.dataset.adminEdit]));
        });
        adminList.querySelectorAll('[data-admin-toggle]').forEach(btn => {
            btn.addEventListener('click', async () => {
                const name = btn.dataset.adminToggle;
                const enabled = btn.dataset.enabled !== '1';
                await fetch(`/api/admin/sources/${encodeURIComponent(name)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled }),
                });
                loadAdminSources();
            });
        });
        adminList.querySelectorAll('[data-admin-fetch]').forEach(btn => {
            btn.addEventListener('click', async () => {
                btn.textContent = '…';
                const res = await fetch(`/api/admin/sources/${encodeURIComponent(btn.dataset.adminFetch)}/fetch`, { method: 'POST' });
                const data = await res.json();
                btn.textContent = data.ok ? '已触发' : '失败';
                setTimeout(() => { btn.textContent = '抓取'; }, 1500);
            });
        });
        adminList.querySelectorAll('[data-admin-del]').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (!confirm(`删除自定义源「${btn.dataset.adminDel}」？`)) return;
                await fetch(`/api/admin/sources/${encodeURIComponent(btn.dataset.adminDel)}`, { method: 'DELETE' });
                loadAdminSources();
            });
        });
    }

    init();
</script>
</body>
</html>
