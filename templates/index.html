<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Syne', 'Noto Sans SC', 'sans-serif'],
                        sans: ['Noto Sans SC', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        ink: {
                            950: '#07080a',
                            900: '#0c0e12',
                            800: '#14171d',
                            700: '#1c2129',
                            600: '#2a313c',
                        },
                        mist: {
                            50: '#f4f1ea',
                            100: '#e7e2d6',
                            300: '#b7b0a2',
                            400: '#8f8778',
                            500: '#6e675b',
                        },
                        brass: {
                            DEFAULT: '#c6a15b',
                            dim: '#9a7a3d',
                            soft: 'rgba(198, 161, 91, 0.14)',
                        },
                    },
                    boxShadow: {
                        panel: '0 24px 60px rgba(0,0,0,0.45)',
                        lift: '0 10px 30px rgba(0,0,0,0.28)',
                    },
                    animation: {
                        'fade-up': 'fadeUp 0.35s ease both',
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'none' },
                        },
                    },
                },
            },
        };
    </script>
    <style>
        body {
            background:
                radial-gradient(ellipse 80% 50% at 10% -10%, rgba(198,161,91,0.12), transparent 55%),
                radial-gradient(ellipse 60% 40% at 100% 0%, rgba(120,140,160,0.08), transparent 50%),
                #07080a;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            border: 1px solid rgba(244,241,234,0.1);
            background: rgba(255,255,255,0.03);
            color: #8f8778;
            font-size: 0.75rem;
            line-height: 1.2;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            transition: all 0.15s ease;
            cursor: pointer;
            font-family: inherit;
        }
        .chip:hover { color: #f4f1ea; border-color: rgba(244,241,234,0.22); }
        .chip.active {
            color: #07080a;
            background: #c6a15b;
            border-color: #c6a15b;
            font-weight: 600;
        }
        .chip.hot:not(.active) { border-color: rgba(198,161,91,0.35); color: #c6a15b; }
        .chip .count { opacity: 0.65; font-variant-numeric: tabular-nums; }
        .tag-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            background: rgba(198,161,91,0.12);
            color: #c6a15b;
            font-size: 0.7rem;
            margin-right: 0.3rem;
        }
        #healthBody:not(.open) { display: none; }
        #healthBody.open { display: block; }
        .spinner {
            width: 28px; height: 28px; margin: 0 auto 0.75rem;
            border: 2px solid rgba(244,241,234,0.12);
            border-top-color: #c6a15b;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .skeleton-line {
            height: 0.65rem; border-radius: 4px;
            background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.09), rgba(255,255,255,0.04));
            background-size: 200% 100%;
            animation: shimmer 1.2s ease infinite;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }
        select option, select optgroup { background: #14171d; color: #f4f1ea; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-2.expanded {
            display: block;
            -webkit-line-clamp: unset;
            overflow: visible;
        }
        body.read-mode .article-summary:not(.expanded) {
            -webkit-line-clamp: 5;
        }
        body.read-mode .article-summary {
            font-size: 0.8125rem;
            line-height: 1.65;
            color: #b7b0a2;
        }
        body.read-mode #articlesContainer article.group {
            padding: 1.15rem 1.25rem;
        }
        .cluster-timeline {
            position: relative;
            margin-top: 0.65rem;
            padding-left: 0.85rem;
            border-left: 1px solid rgba(198, 161, 91, 0.28);
        }
        .cluster-timeline-item {
            position: relative;
            padding: 0.55rem 0 0.55rem 0.85rem;
        }
        .cluster-timeline-item::before {
            content: '';
            position: absolute;
            left: -0.85rem;
            top: 0.9rem;
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 999px;
            background: #c6a15b;
            box-shadow: 0 0 0 3px rgba(198, 161, 91, 0.18);
            transform: translateX(-50%);
        }
        .cluster-timeline-item.is-primary::before {
            background: #f4f1ea;
            box-shadow: 0 0 0 3px rgba(198, 161, 91, 0.35);
        }
        .article-summary[data-reader] {
            cursor: pointer;
        }
        .article-summary[data-reader]:hover {
            color: #b7b0a2;
        }
        .reader-overlay {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: flex;
            justify-content: flex-end;
        }
        .reader-overlay.hidden { display: none; }
        .reader-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(7, 8, 10, 0.62);
            backdrop-filter: blur(2px);
        }
        .reader-panel {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            width: min(34rem, 100%);
            height: 100%;
            background:
                linear-gradient(180deg, rgba(198,161,91,0.06), transparent 28%),
                #0c0e12;
            border-left: 1px solid rgba(255,255,255,0.1);
            box-shadow: -24px 0 60px rgba(0,0,0,0.45);
            animation: readerIn 0.22s ease both;
        }
        @keyframes readerIn {
            from { transform: translateX(18px); opacity: 0.6; }
            to { transform: none; opacity: 1; }
        }
        .reader-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem 1.35rem 2rem;
        }
        .reader-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 0.85rem 1.25rem;
            background: rgba(20, 23, 29, 0.92);
        }
        body.reader-open { overflow: hidden; }
        .admin-input {
            width: 100%;
            border-radius: 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(12,14,18,0.8);
            padding: 0.55rem 0.85rem;
            font-size: 0.875rem;
            color: #f4f1ea;
            outline: none;
            line-height: 1.25;
        }
        .admin-input:focus { border-color: rgba(198,161,91,0.5); }
        .admin-toolbar {
            display: grid;
            gap: 0.65rem;
            grid-template-columns: 1fr;
        }
        @media (min-width: 640px) {
            .admin-toolbar {
                grid-template-columns: minmax(0, 1fr) 7.5rem auto;
                align-items: stretch;
            }
        }
        .admin-toolbar .admin-input,
        .admin-toolbar .admin-btn {
            height: 2.5rem;
            box-sizing: border-box;
        }
        .admin-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            border-radius: 0.75rem;
            padding: 0 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid transparent;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .admin-btn-primary {
            background: #c6a15b;
            color: #07080a;
        }
        .admin-btn-primary:hover { filter: brightness(1.05); }
        .admin-btn-ghost {
            background: transparent;
            border-color: rgba(255,255,255,0.1);
            color: #b7b0a2;
        }
        .admin-btn-ghost:hover {
            border-color: rgba(198,161,91,0.4);
            color: #c6a15b;
        }
        .admin-label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #8f8778;
        }
    </style>
</head>
<body class="h-full font-sans text-mist-50 antialiased">
<div class="relative mx-auto max-w-6xl px-4 pb-16 pt-6 sm:px-6 lg:px-8">

    <!-- Top bar -->
    <header class="mb-8 flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
        <div class="flex items-end gap-6">
            <h1 class="font-display text-5xl font-bold leading-none tracking-[0.04em] text-mist-50 sm:text-6xl">AGORA</h1>
            <nav class="mb-1.5 flex flex-wrap gap-1 rounded-full border border-white/10 bg-ink-800/70 p-1 backdrop-blur" aria-label="视图">
                <button type="button" data-view="timeline" class="view-btn rounded-full px-3.5 py-1.5 text-xs font-medium text-mist-50 bg-brass shadow-sm">认知</button>
                <button type="button" data-view="briefing" class="view-btn rounded-full px-3.5 py-1.5 text-xs font-medium text-mist-400 hover:text-mist-100">今日简报</button>
                <button type="button" data-view="agenda" class="view-btn rounded-full px-3.5 py-1.5 text-xs font-medium text-mist-400 hover:text-mist-100">财报专栏</button>
                <button type="button" data-view="library" class="view-btn rounded-full px-3.5 py-1.5 text-xs font-medium text-mist-400 hover:text-mist-100">收藏</button>
                <button type="button" data-view="sources" class="view-btn rounded-full px-3.5 py-1.5 text-xs font-medium text-mist-400 hover:text-mist-100">源管理</button>
            </nav>
        </div>
        <div class="flex flex-wrap items-center gap-x-5 gap-y-1 font-display text-[11px] uppercase tracking-[0.16em] text-mist-400">
            <span><em id="totalCount" class="not-italic text-mist-100">—</em> 篇</span>
            <span><em id="sourceCount" class="not-italic text-mist-100">—</em> 源</span>
            <span><em id="domainCount" class="not-italic text-mist-100">—</em> 域</span>
            <span id="updateTime" class="text-brass">—</span>
        </div>
    </header>

    <!-- Timeline / Library -->
    <div id="feedWrap">
        <section class="mb-6 overflow-hidden rounded-2xl border border-white/10 bg-ink-800/60 shadow-panel backdrop-blur-md">
            <div class="border-b border-white/5 px-4 py-3 sm:px-5">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                    <input type="search" id="searchInput" placeholder="搜索标题"
                           class="w-full flex-1 rounded-xl border border-white/10 bg-ink-900/80 px-3.5 py-2.5 text-sm text-mist-50 placeholder:text-mist-500 outline-none transition focus:border-brass/50 focus:ring-1 focus:ring-brass/30">
                    <div class="flex items-center gap-2">
                        <div id="activeSummary" class="min-h-[1.25rem] flex-1 text-xs text-mist-400">全部</div>
                        <button type="button" id="resetFilters" disabled
                                class="rounded-lg border border-white/10 px-3 py-1.5 text-xs text-mist-400 transition enabled:hover:border-brass/40 enabled:hover:text-brass disabled:opacity-30">清除</button>
                    </div>
                </div>
            </div>

            <div class="space-y-3.5 px-4 py-4 sm:px-5">
                <div class="grid gap-2 sm:grid-cols-[3.5rem_1fr] sm:items-start">
                    <div class="pt-1.5 text-[11px] uppercase tracking-[0.14em] text-mist-500">时间</div>
                    <div class="flex flex-wrap gap-1.5" id="timeFilter"></div>
                </div>
                <div class="grid hidden gap-2 sm:grid-cols-[3.5rem_1fr] sm:items-start" id="shelfRow">
                    <div class="pt-1.5 text-[11px] uppercase tracking-[0.14em] text-mist-500">状态</div>
                    <div class="flex flex-wrap gap-1.5" id="shelfFilter"></div>
                </div>
                <div class="grid gap-2 sm:grid-cols-[3.5rem_1fr] sm:items-start" id="domainRow">
                    <div class="pt-1.5 text-[11px] uppercase tracking-[0.14em] text-mist-500">领域</div>
                    <div class="flex flex-wrap gap-1.5" id="domainFilter"></div>
                </div>
                <div class="grid gap-2 sm:grid-cols-[3.5rem_1fr] sm:items-start" id="typeRow">
                    <div class="pt-1.5 text-[11px] uppercase tracking-[0.14em] text-mist-500">文体</div>
                    <div class="flex flex-wrap gap-1.5" id="typeFilter"></div>
                </div>
                <div class="grid gap-2 sm:grid-cols-[3.5rem_1fr] sm:items-center" id="countryRow">
                    <div class="text-[11px] uppercase tracking-[0.14em] text-mist-500">国家</div>
                    <select id="countrySelect" aria-label="国家"
                            class="max-w-xs rounded-xl border border-white/10 bg-ink-900/80 px-3 py-2 text-sm text-mist-100 outline-none focus:border-brass/50">
                        <option value="all">全部</option>
                    </select>
                </div>
                <div class="grid gap-2 sm:grid-cols-[3.5rem_1fr] sm:items-start" id="topicRow">
                    <div class="pt-1.5 text-[11px] uppercase tracking-[0.14em] text-mist-500">议题</div>
                    <div class="flex flex-wrap gap-1.5" id="topicsCloud"><span class="text-xs text-mist-500">—</span></div>
                </div>
            </div>

            <div class="border-t border-white/5 px-4 py-2 sm:px-5">
                <button type="button" id="healthToggle" class="flex w-full items-center justify-between py-1 text-left text-xs text-mist-500 hover:text-mist-300">
                    <span>源状态</span>
                    <span id="healthPills" class="flex gap-2 font-normal"></span>
                </button>
                <div id="healthBody" class="overflow-x-auto pb-3 pt-2">
                    <table class="w-full min-w-[640px] text-left text-xs text-mist-400">
                        <thead class="text-mist-500">
                            <tr class="border-b border-white/5">
                                <th class="py-2 font-medium">状态</th>
                                <th class="py-2 font-medium">来源</th>
                                <th class="py-2 font-medium">成功</th>
                                <th class="py-2 font-medium">失败</th>
                                <th class="py-2 font-medium">噪音</th>
                                <th class="py-2 font-medium">最近</th>
                                <th class="py-2 font-medium">说明</th>
                            </tr>
                        </thead>
                        <tbody id="healthTableBody">
                            <tr><td colspan="7" class="py-3">…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <div class="mb-3 flex items-center justify-between gap-3">
            <div id="resultInfo" class="font-display text-[11px] tracking-[0.12em] text-mist-500"></div>
            <button type="button" id="readModeToggle" aria-pressed="false"
                    class="shrink-0 rounded-full border border-white/10 px-3 py-1.5 text-[11px] text-mist-400 transition hover:border-brass/40 hover:text-brass"
                    title="开启后卡片显示更长摘要；点「展开」打开细读">阅读模式</button>
        </div>

        <div id="articlesContainer">
            <div class="flex flex-col items-center justify-center py-20 text-mist-400">
                <div class="spinner"></div>
                <div class="text-sm">加载中</div>
            </div>
        </div>
        <nav id="pagination" class="mt-8 hidden flex-wrap items-center justify-center gap-1.5"></nav>
    </div>

    <!-- Agenda -->
    <div id="calendarWrap" class="hidden">
        <section class="mb-5 rounded-2xl border border-white/10 bg-ink-800/60 p-4 shadow-panel backdrop-blur-md sm:p-5">
            <div class="mb-4 flex flex-wrap gap-1.5" id="calTimeFilter"></div>
            <div class="flex flex-wrap gap-1.5" id="calCompanies"></div>
        </section>
        <div id="calendarBody"></div>
    </div>

    <!-- Briefing -->
    <div id="briefingWrap" class="hidden">
        <section class="mb-5 rounded-2xl border border-white/10 bg-ink-800/60 shadow-panel backdrop-blur-md">
            <div class="border-b border-white/5 px-4 py-4 sm:px-5">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
                    <div>
                        <h2 class="font-display text-xl tracking-wide text-mist-50">今日简报</h2>
                        <p class="mt-1 text-xs text-mist-400">按领域挑选近 24 小时要点，同题已合并</p>
                    </div>
                    <div class="flex flex-wrap gap-1.5" id="briefDaysFilter"></div>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2 border-b border-white/5 px-4 py-3 sm:px-5">
                <button type="button" id="briefRefresh" class="rounded-lg border border-white/10 px-3 py-1.5 text-xs text-mist-300 hover:border-brass/40 hover:text-brass">刷新</button>
                <button type="button" id="briefCopyMd" class="rounded-lg border border-white/10 px-3 py-1.5 text-xs text-mist-300 hover:border-brass/40 hover:text-brass">复制 Markdown</button>
                <button type="button" id="briefCopyLink" class="rounded-lg border border-white/10 px-3 py-1.5 text-xs text-mist-300 hover:border-brass/40 hover:text-brass">复制链接</button>
                <a id="briefSharePage" href="/share/briefing?days=1" target="_blank" rel="noopener" class="rounded-lg bg-brass px-3 py-1.5 text-xs font-semibold text-ink-950 hover:brightness-105">打开分享页</a>
                <a id="briefDownloadMd" href="/api/briefing.md?days=1&download=1" class="rounded-lg border border-white/10 px-3 py-1.5 text-xs text-mist-300 hover:border-brass/40 hover:text-brass">下载 .md</a>
                <span id="briefShareMsg" class="text-xs text-mist-500"></span>
            </div>
            <div id="briefTopics" class="flex flex-wrap gap-1.5 px-4 py-3 sm:px-5"></div>
        </section>
        <div id="briefingBody"></div>
    </div>

    <!-- Sources admin -->
    <div id="sourcesWrap" class="hidden">
        <section class="mb-5 rounded-2xl border border-white/10 bg-ink-800/60 shadow-panel backdrop-blur-md">
            <div class="border-b border-white/5 px-4 py-4 sm:px-5">
                <h2 class="font-display text-xl tracking-wide text-mist-50">源管理</h2>
                <p class="mt-1 text-xs leading-relaxed text-mist-400">增删自定义源；内置源可禁用、改 RSS 或试抓</p>
            </div>
            <div class="px-4 py-4 sm:px-5">
                <div class="admin-toolbar">
                    <input type="search" id="adminSearch" placeholder="搜索源名 / RSS" class="admin-input" aria-label="搜索源">
                    <select id="adminOrigin" class="admin-input" aria-label="来源类型">
                        <option value="all">全部来源</option>
                        <option value="builtin">内置</option>
                        <option value="custom">自定义</option>
                    </select>
                    <button type="button" id="adminNewBtn" class="admin-btn admin-btn-primary">新增源</button>
                </div>
            </div>
            <div id="adminForm" class="hidden border-t border-white/5 px-4 py-5 sm:px-5">
                <div class="mb-4 text-xs text-mist-400" id="adminFormTitle">新增自定义源</div>
                <div class="grid gap-3 sm:grid-cols-2">
                    <div>
                        <label class="admin-label" for="afName">英文名 name</label>
                        <input id="afName" class="admin-input" placeholder="Example Institute">
                    </div>
                    <div>
                        <label class="admin-label" for="afNameCn">中文名</label>
                        <input id="afNameCn" class="admin-input" placeholder="示例机构">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="admin-label" for="afRss">RSS URL</label>
                        <input id="afRss" class="admin-input" placeholder="https://…/feed.xml">
                    </div>
                    <div>
                        <label class="admin-label" for="afCountry">国家</label>
                        <input id="afCountry" class="admin-input" value="其他">
                    </div>
                    <div>
                        <label class="admin-label" for="afCategory">分类</label>
                        <input id="afCategory" class="admin-input" value="其他">
                    </div>
                    <div>
                        <label class="admin-label" for="afDocType">文体</label>
                        <select id="afDocType" class="admin-input"></select>
                    </div>
                    <div>
                        <label class="admin-label" for="afDomain">领域</label>
                        <select id="afDomain" class="admin-input"></select>
                    </div>
                    <div>
                        <label class="admin-label" for="afPriority">优先级</label>
                        <select id="afPriority" class="admin-input">
                            <option value="1">高优 (1)</option>
                            <option value="2" selected>普通 (2)</option>
                        </select>
                    </div>
                    <div>
                        <label class="admin-label" for="afIcon">图标 URL</label>
                        <input id="afIcon" class="admin-input" placeholder="https://…/favicon.ico">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="admin-label" for="afDesc">源简介</label>
                        <input id="afDesc" class="admin-input" placeholder="可选">
                    </div>
                </div>
                <div class="mt-4 flex flex-wrap items-center gap-2">
                    <button type="button" id="afSave" class="admin-btn admin-btn-primary">保存</button>
                    <button type="button" id="afTest" class="admin-btn admin-btn-ghost">试抓</button>
                    <button type="button" id="afCancel" class="admin-btn admin-btn-ghost">取消</button>
                    <span id="afMsg" class="text-xs text-mist-500"></span>
                </div>
                <div id="afTestResult" class="mt-3 hidden rounded-xl border border-white/5 bg-ink-900/50 p-3 text-xs text-mist-400"></div>
            </div>
        </section>
        <div id="adminList"></div>
    </div>
</div>

<!-- Reading panel -->
<div id="readerOverlay" class="reader-overlay hidden" aria-hidden="true">
    <div class="reader-backdrop" data-close-reader tabindex="-1"></div>
    <aside id="readerPanel" class="reader-panel" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
        <div class="flex items-start justify-between gap-3 border-b border-white/8 px-5 py-4">
            <div class="min-w-0">
                <div class="font-display text-[11px] uppercase tracking-[0.16em] text-brass">细读</div>
                <div id="readerMeta" class="mt-1.5 flex flex-wrap gap-1.5 text-[11px] text-mist-500"></div>
            </div>
            <button type="button" id="readerClose" class="rounded-lg border border-white/10 px-2.5 py-1 text-xs text-mist-400 hover:border-white/25 hover:text-mist-100" aria-label="关闭">关闭</button>
        </div>
        <div class="reader-scroll">
            <h2 id="readerTitle" class="text-lg font-semibold leading-snug tracking-tight text-mist-50"></h2>
            <p id="readerSummary" class="mt-4 text-sm leading-relaxed text-mist-300 whitespace-pre-wrap"></p>
            <div id="readerEmpty" class="mt-4 hidden rounded-xl border border-dashed border-white/10 px-4 py-6 text-center text-xs text-mist-500">此条目暂无 RSS 摘要，可打开原文阅读。</div>
            <div id="readerRelated" class="mt-6 hidden"></div>
        </div>
        <div class="reader-actions">
            <button type="button" id="readerLater" class="rounded-md border border-white/10 px-3 py-1.5 text-xs text-mist-300 hover:border-white/25">稍后</button>
            <button type="button" id="readerRead" class="rounded-md border border-white/10 px-3 py-1.5 text-xs text-mist-300 hover:border-white/25">已读</button>
            <a id="readerOpen" href="#" target="_blank" rel="noopener noreferrer" class="rounded-md bg-brass px-3 py-1.5 text-xs font-semibold text-ink-950 hover:brightness-105">打开原文</a>
        </div>
    </aside>
</div>

<script>
    const PER_PAGE = 24;
    const PRIORITY_COUNTRIES = ['中国', '美国', '国际', '英国', '德国', '法国', '日本', '韩国', '印度', '欧盟'];

    let currentSourceType = 'all';
    let currentDomain = 'all';
    let currentDays = 'all';
    let currentCountry = 'all';
    let currentTopic = 'all';
    let currentTopicLabel = '';
    let currentQuery = '';
    let currentShelf = 'all';
    let currentView = 'timeline';
    let currentPage = 1;
    let pollTimer = null;
    let topicsLoaded = false;
    let topicOptions = [];
    let searchTimer = null;
    let healthLoaded = false;
    let shelfPool = null;
    let shelfPoolKey = '';
    let calDays = '30';
    let calCompany = 'all';
    let briefDays = '1';
    let adminEditing = null; // name when editing, null when creating
    let adminLabels = { doc_type_labels: {}, domain_labels: {} };
    let lastFeedArticles = [];
    let readerArticle = null;
    let readMode = localStorage.getItem('agora.readMode') === '1';

    const STORE_KEY = 'agora.reading.v1';
    const container = document.getElementById('articlesContainer');
    const paginationEl = document.getElementById('pagination');
    const totalCountSpan = document.getElementById('totalCount');
    const sourceCountSpan = document.getElementById('sourceCount');
    const domainCountSpan = document.getElementById('domainCount');
    const updateTimeSpan = document.getElementById('updateTime');
    const resultInfo = document.getElementById('resultInfo');
    const readModeToggle = document.getElementById('readModeToggle');
    const readerOverlay = document.getElementById('readerOverlay');
    const readerTitle = document.getElementById('readerTitle');
    const readerMeta = document.getElementById('readerMeta');
    const readerSummary = document.getElementById('readerSummary');
    const readerEmpty = document.getElementById('readerEmpty');
    const readerRelated = document.getElementById('readerRelated');
    const readerLater = document.getElementById('readerLater');
    const readerRead = document.getElementById('readerRead');
    const readerOpen = document.getElementById('readerOpen');
    const countrySelect = document.getElementById('countrySelect');
    const resetBtn = document.getElementById('resetFilters');
    const searchInput = document.getElementById('searchInput');
    const healthToggle = document.getElementById('healthToggle');
    const healthBody = document.getElementById('healthBody');
    const healthPills = document.getElementById('healthPills');
    const healthTableBody = document.getElementById('healthTableBody');
    const feedWrap = document.getElementById('feedWrap');
    const calendarWrap = document.getElementById('calendarWrap');
    const calendarBody = document.getElementById('calendarBody');
    const calCompaniesEl = document.getElementById('calCompanies');
    const briefingWrap = document.getElementById('briefingWrap');
    const briefingBody = document.getElementById('briefingBody');
    const sourcesWrap = document.getElementById('sourcesWrap');
    const adminList = document.getElementById('adminList');
    const adminForm = document.getElementById('adminForm');
    const afMsg = document.getElementById('afMsg');
    const afTestResult = document.getElementById('afTestResult');

    const DOC_TYPES = [
        { id: 'all', label: '全部' },
        { id: 'think_tank', label: '智库' },
        { id: 'earnings', label: '财报' },
        { id: 'research', label: '研报' },
        { id: 'whitepaper', label: '白皮书' },
        { id: 'policy', label: '政策文件' },
        { id: 'paper', label: '科学论文' },
        { id: 'data', label: '数据发布' },
        { id: 'announcement', label: '公司公告' },
        { id: 'media', label: '媒体' },
    ];
    const TIME_RANGES = [
        { id: 'all', label: '全部' },
        { id: '3', label: '近3天' },
        { id: '7', label: '近7天' },
        { id: '30', label: '近30天' },
    ];
    const SHELF_OPTIONS = [
        { id: 'later', label: '稍后' },
        { id: 'read', label: '已读' },
        { id: 'unread', label: '未读' },
    ];
    const DOMAINS = [
        { id: 'all', label: '全部' },
        { id: 'geopolitics', label: '地缘' },
        { id: 'industry', label: '产业' },
        { id: 'macro', label: '宏观金融' },
        { id: 'tech', label: '科技' },
        { id: 'energy', label: '能源气候' },
        { id: 'health', label: '卫生健康' },
        { id: 'general', label: '综合' },
    ];
    const TYPE_LABELS = Object.fromEntries(DOC_TYPES.map(t => [t.id, t.label]));
    const DOMAIN_LABEL_MAP = Object.fromEntries(DOMAINS.map(t => [t.id, t.label]));
    const TIME_LABEL_MAP = Object.fromEntries(TIME_RANGES.map(t => [t.id, t.label]));
    const SHELF_LABEL_MAP = Object.fromEntries(SHELF_OPTIONS.map(t => [t.id, t.label]));

    function loadReadingStore() {
        try {
            const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
            return {
                read: raw.read && typeof raw.read === 'object' ? raw.read : {},
                later: raw.later && typeof raw.later === 'object' ? raw.later : {},
            };
        } catch {
            return { read: {}, later: {} };
        }
    }
    function saveReadingStore(store) { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
    function isRead(link) { return !!loadReadingStore().read[link]; }
    function isLater(link) { return !!loadReadingStore().later[link]; }
    function markRead(link, on = true) {
        const store = loadReadingStore();
        if (on) { store.read[link] = Date.now(); delete store.later[link]; }
        else delete store.read[link];
        saveReadingStore(store);
    }
    function toggleLater(link) {
        const store = loadReadingStore();
        if (store.later[link]) delete store.later[link];
        else { store.later[link] = Date.now(); delete store.read[link]; }
        saveReadingStore(store);
        return !!store.later[link];
    }
    function matchesShelf(link) {
        if (currentShelf === 'all') return true;
        if (currentShelf === 'unread') return !isRead(link);
        if (currentShelf === 'later') return isLater(link);
        if (currentShelf === 'read') return isRead(link);
        return true;
    }

    function setViewButtons() {
        document.querySelectorAll('.view-btn').forEach(btn => {
            const on = btn.dataset.view === currentView;
            btn.className = on
                ? 'view-btn rounded-full px-3.5 py-1.5 text-xs font-medium text-ink-950 bg-brass shadow-sm'
                : 'view-btn rounded-full px-3.5 py-1.5 text-xs font-medium text-mist-400 hover:text-mist-100';
        });
    }

    function applyViewChrome() {
        const lib = currentView === 'library';
        const agenda = currentView === 'agenda';
        const briefing = currentView === 'briefing';
        const sources = currentView === 'sources';
        feedWrap.classList.toggle('hidden', agenda || briefing || sources);
        calendarWrap.classList.toggle('hidden', !agenda);
        briefingWrap.classList.toggle('hidden', !briefing);
        sourcesWrap.classList.toggle('hidden', !sources);
        const shelfRow = document.getElementById('shelfRow');
        if (shelfRow) shelfRow.classList.toggle('hidden', !lib);
        ['domainRow', 'typeRow', 'countryRow', 'topicRow'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden', lib);
        });
        setViewButtons();
    }

    async function init() {
        try {
            bindViewNav();
            const [sourcesRes, statsRes] = await Promise.all([
                fetchJson('/api/sources'),
                fetchJson('/api/stats'),
            ]);
            void sourcesRes;
            const stats = statsRes;
            sourceCountSpan.textContent = stats.total_sources;
            domainCountSpan.textContent = Object.keys(stats.domain_stats || {}).length;
            renderTimeFilters();
            renderShelfFilters();
            renderDomainFilters();
            renderTypeFilters();
            renderCountrySelect(Object.keys(stats.country_stats || {}));
            renderCalTimeFilters();
            renderBriefDaysFilters();
            bindReset();
            bindSearch();
            bindHealth();
            bindReadMode();
            bindBriefing();
            bindAdmin();
            updateActiveSummary();
            applyViewChrome();
            loadHealth(true);
            await waitForCacheAndLoad();
        } catch (err) {
            showError(err.message);
        }
    }

    async function waitForCacheAndLoad() {
        const ready = await checkStatus();
        if (!ready) {
            pollTimer = setInterval(async () => {
                if (await checkStatus()) {
                    clearInterval(pollTimer);
                    await Promise.all([loadTopics(), loadArticles(1)]);
                }
            }, 2000);
        } else {
            await Promise.all([loadTopics(), loadArticles(1)]);
        }
    }

    async function loadTopics() {
        try {
            const res = await fetch('/api/topics?days=7&limit=14');
            const data = await res.json();
            if (data.loading) return;
            topicsLoaded = true;
            topicOptions = data.topics || [];
            renderTopics(topicOptions);
        } catch {
            document.getElementById('topicsCloud').innerHTML = '<span class="text-xs text-mist-500">—</span>';
        }
    }

    function renderTopics(topics) {
        const el = document.getElementById('topicsCloud');
        if (!topics.length) {
            el.innerHTML = '<span class="text-xs text-mist-500">—</span>';
            return;
        }
        const max = Math.max(...topics.map(t => t.count));
        let html = `<button type="button" class="chip ${currentTopic === 'all' ? 'active' : ''}" data-topic="all">全部</button>`;
        topics.forEach(t => {
            const hot = t.count >= max * 0.6 ? ' hot' : '';
            html += `<button type="button" class="chip${hot} ${currentTopic === t.id ? 'active' : ''}" data-topic="${escapeHtml(t.id)}" data-label="${escapeHtml(t.label)}">${escapeHtml(t.label)}<span class="count">${t.count}</span></button>`;
        });
        el.innerHTML = html;
        el.querySelectorAll('.chip').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTopic = btn.dataset.topic;
                currentTopicLabel = btn.dataset.label || '';
                invalidateShelfPool();
                el.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));
                updateActiveSummary();
                loadArticles(1);
                scrollToResults();
            });
        });
    }

    async function checkStatus() {
        const res = await fetch('/api/articles/status');
        const data = await res.json();
        if (data.ready) {
            if (data.cached_at) updateTimeSpan.textContent = formatCachedTime(data.cached_at);
            totalCountSpan.textContent = data.total;
        }
        return data.ready;
    }

    async function loadArticles(page) {
        currentPage = page;
        showSkeleton();
        // 时间线不做状态筛选；收藏才按稍后/已读过滤
        if (currentView === 'library') {
            await loadShelfPage(page);
            return;
        }
        const params = new URLSearchParams({
            page, per_page: PER_PAGE,
            source_type: currentSourceType, domain: currentDomain,
            country: currentCountry, topic: currentTopic,
            days: currentDays, merge: '1',
        });
        if (currentQuery) params.set('q', currentQuery);
        if (!topicsLoaded) loadTopics();
        try {
            const res = await fetch(`/api/articles?${params}`);
            const data = await res.json();
            if (data.loading) { showLoadingPanel(); return; }
            totalCountSpan.textContent = data.pagination.total;
            if (data.cached_at) updateTimeSpan.textContent = formatCachedTime(data.cached_at);
            renderArticles(data.articles);
            renderPagination(data.pagination);
            updateResultInfo(data.pagination);
        } catch (err) {
            showError(err.message);
        }
    }

    function filterKey() {
        return [currentSourceType, currentDomain, currentCountry, currentTopic, currentDays, currentQuery, currentView].join('|');
    }

    async function ensureShelfPool() {
        const key = filterKey();
        if (shelfPool && shelfPoolKey === key) return shelfPool;
        const params = new URLSearchParams({
            page: 1, per_page: 400, pool: '1',
            source_type: currentSourceType, domain: currentDomain,
            country: currentCountry, topic: currentTopic,
            days: currentDays === 'all' ? '30' : currentDays,
            merge: '1',
        });
        if (currentQuery) params.set('q', currentQuery);
        const res = await fetch(`/api/articles?${params}`);
        const data = await res.json();
        shelfPool = data.articles || [];
        shelfPoolKey = key;
        if (data.cached_at) updateTimeSpan.textContent = formatCachedTime(data.cached_at);
        return shelfPool;
    }

    async function loadShelfPage(page) {
        try {
            const pool = await ensureShelfPool();
            const shelf = currentShelf === 'all' ? 'later' : currentShelf;
            const filtered = pool.filter(a => {
                if (shelf === 'unread') return !isRead(a.link);
                if (shelf === 'later') return isLater(a.link);
                if (shelf === 'read') return isRead(a.link);
                return isLater(a.link);
            });
            const total = filtered.length;
            const totalPages = Math.max(1, Math.ceil(total / PER_PAGE) || 1);
            const p = Math.min(Math.max(1, page), totalPages);
            currentPage = p;
            const start = (p - 1) * PER_PAGE;
            const slice = filtered.slice(start, start + PER_PAGE);
            const pagination = {
                page: p, per_page: PER_PAGE, total, total_pages: totalPages,
                has_prev: p > 1, has_next: p < totalPages,
            };
            totalCountSpan.textContent = total;
            renderArticles(slice);
            renderPagination(pagination);
            updateResultInfo(pagination);
        } catch (err) {
            showError(err.message);
        }
    }

    function invalidateShelfPool() { shelfPool = null; shelfPoolKey = ''; }

    function showSkeleton() {
        container.innerHTML = `<div class="grid gap-3 sm:grid-cols-2">${Array.from({ length: 6 }, () => `
            <div class="rounded-2xl border border-white/5 bg-ink-800/40 p-4 space-y-3">
                <div class="skeleton-line" style="width:30%"></div>
                <div class="skeleton-line" style="width:92%"></div>
                <div class="skeleton-line" style="width:70%"></div>
            </div>`).join('')}</div>`;
        paginationEl.classList.add('hidden');
        paginationEl.style.display = 'none';
    }

    function showLoadingPanel() {
        container.innerHTML = `<div class="flex flex-col items-center justify-center py-20 text-mist-400"><div class="spinner"></div><div class="text-sm">加载中</div></div>`;
        paginationEl.style.display = 'none';
        resultInfo.textContent = '';
    }

    function showError(msg) {
        container.innerHTML = `<div class="flex flex-col items-center justify-center py-20"><div class="text-sm text-red-400">失败</div><div class="mt-2 text-xs text-mist-500">${escapeHtml(msg)}</div></div>`;
    }

    function bindChipRow(el, items, current, key, onPick) {
        el.innerHTML = items.map(({ id, label }) =>
            `<button type="button" class="chip ${current === id ? 'active' : ''}" data-id="${id}">${label}</button>`
        ).join('');
        el.querySelectorAll('.chip').forEach(btn => {
            btn.addEventListener('click', () => {
                onPick(btn.dataset.id);
                el.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));
                updateActiveSummary();
                loadArticles(1);
                scrollToResults();
            });
        });
    }

    function renderTimeFilters() {
        bindChipRow(document.getElementById('timeFilter'), TIME_RANGES, currentDays, 'days', id => {
            currentDays = id; invalidateShelfPool();
        });
    }
    function renderShelfFilters() {
        bindChipRow(document.getElementById('shelfFilter'), SHELF_OPTIONS, currentShelf, 'shelf', id => {
            currentShelf = id;
        });
    }
    function renderDomainFilters() {
        bindChipRow(document.getElementById('domainFilter'), DOMAINS, currentDomain, 'domain', id => {
            currentDomain = id; invalidateShelfPool();
        });
    }
    function renderTypeFilters() {
        bindChipRow(document.getElementById('typeFilter'), DOC_TYPES, currentSourceType, 'type', id => {
            currentSourceType = id; invalidateShelfPool();
        });
    }

    function renderCountrySelect(countries) {
        const priority = PRIORITY_COUNTRIES.filter(c => countries.includes(c));
        const rest = countries.filter(c => !PRIORITY_COUNTRIES.includes(c)).sort();
        let html = '<option value="all">全部</option>';
        if (priority.length) {
            html += '<optgroup label="常用">' + priority.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') + '</optgroup>';
        }
        if (rest.length) {
            html += '<optgroup label="更多">' + rest.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') + '</optgroup>';
        }
        countrySelect.innerHTML = html;
        countrySelect.value = currentCountry;
        countrySelect.onchange = () => {
            currentCountry = countrySelect.value;
            invalidateShelfPool();
            updateActiveSummary();
            loadArticles(1);
            scrollToResults();
        };
    }

    function bindSearch() {
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentQuery = searchInput.value.trim();
                invalidateShelfPool();
                updateActiveSummary();
                loadArticles(1);
            }, 320);
        });
        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                clearTimeout(searchTimer);
                currentQuery = searchInput.value.trim();
                invalidateShelfPool();
                updateActiveSummary();
                loadArticles(1);
            }
        });
    }

    function bindHealth() {
        healthToggle.addEventListener('click', async () => {
            healthBody.classList.toggle('open');
            await loadHealth(false);
        });
    }

    async function loadHealth(silent) {
        try {
            const res = await fetch('/api/feeds/health');
            const data = await res.json();
            healthLoaded = true;
            healthPills.innerHTML = `
                <span class="text-emerald-400/90">正常 ${data.ok}</span>
                <span class="text-amber-400/90">异常 ${data.failing}</span>
                <span class="text-mist-500">降权 ${data.demoted}</span>`;
            const rows = (data.sources || []).slice(0, 80);
            if (!rows.length) {
                healthTableBody.innerHTML = '<tr><td colspan="7" class="py-3">—</td></tr>';
                return;
            }
            const statusLabel = { ok: '正常', failing: '异常', demoted: '降权', unknown: '未知' };
            healthTableBody.innerHTML = rows.map(s => `
                <tr class="border-b border-white/[0.03]">
                    <td class="py-2 pr-3">${statusLabel[s.status] || s.status}</td>
                    <td class="py-2 pr-3 text-mist-200">${escapeHtml(s.name_cn || s.name)}</td>
                    <td class="py-2 pr-3">${s.success_count}</td>
                    <td class="py-2 pr-3">${s.fail_count}</td>
                    <td class="py-2 pr-3">${s.noise_count}</td>
                    <td class="py-2 pr-3">${s.last_fetched_at ? formatCachedTime(s.last_fetched_at) : '—'}</td>
                    <td class="py-2 text-mist-500">${escapeHtml(s.demoted_reason || s.last_error || '')}</td>
                </tr>`).join('');
        } catch (err) {
            if (!silent) healthTableBody.innerHTML = `<tr><td colspan="7" class="py-3 text-red-400">${escapeHtml(err.message)}</td></tr>`;
        }
    }

    function bindReset() {
        resetBtn.addEventListener('click', () => {
            currentSourceType = 'all';
            currentDomain = 'all';
            currentDays = 'all';
            currentShelf = currentView === 'library' ? 'later' : 'all';
            currentCountry = 'all';
            currentTopic = 'all';
            currentTopicLabel = '';
            currentQuery = '';
            searchInput.value = '';
            countrySelect.value = 'all';
            invalidateShelfPool();
            renderTimeFilters();
            renderShelfFilters();
            renderDomainFilters();
            renderTypeFilters();
            document.querySelectorAll('#topicsCloud .chip').forEach(b => {
                b.classList.toggle('active', b.dataset.topic === 'all');
            });
            updateActiveSummary();
            loadArticles(1);
        });
    }

    function hasActiveFilters() {
        return currentSourceType !== 'all'
            || currentDomain !== 'all'
            || currentDays !== 'all'
            || (currentView === 'library' && currentShelf !== 'later')
            || currentCountry !== 'all'
            || currentTopic !== 'all'
            || !!currentQuery;
    }

    function updateActiveSummary() {
        const el = document.getElementById('activeSummary');
        if (!hasActiveFilters()) {
            el.innerHTML = '<span class="text-mist-300">全部</span>';
            resetBtn.disabled = true;
            return;
        }
        const pills = [];
        if (currentQuery) pills.push(`<span class="tag-pill">${escapeHtml(currentQuery)}</span>`);
        if (currentDays !== 'all') pills.push(`<span class="tag-pill">${escapeHtml(TIME_LABEL_MAP[currentDays])}</span>`);
        if (currentView === 'library' && currentShelf !== 'later') {
            pills.push(`<span class="tag-pill">${escapeHtml(SHELF_LABEL_MAP[currentShelf])}</span>`);
        }
        if (currentDomain !== 'all') pills.push(`<span class="tag-pill">${escapeHtml(DOMAIN_LABEL_MAP[currentDomain])}</span>`);
        if (currentSourceType !== 'all') pills.push(`<span class="tag-pill">${escapeHtml(TYPE_LABELS[currentSourceType])}</span>`);
        if (currentCountry !== 'all') pills.push(`<span class="tag-pill">${escapeHtml(currentCountry)}</span>`);
        if (currentTopic !== 'all') pills.push(`<span class="tag-pill">${escapeHtml(currentTopicLabel || currentTopic)}</span>`);
        el.innerHTML = pills.join('');
        resetBtn.disabled = false;
    }

    function scrollToResults() {
        window.scrollTo({ top: Math.max(0, container.offsetTop - 80), behavior: 'smooth' });
    }

    function actionBtn(active) {
        return active
            ? 'rounded-md border border-brass/40 bg-brass/15 px-2 py-1 text-[11px] text-brass'
            : 'rounded-md border border-white/10 bg-transparent px-2 py-1 text-[11px] text-mist-400 hover:border-white/20 hover:text-mist-100';
    }

    function applyReadModeChrome() {
        document.body.classList.toggle('read-mode', readMode);
        if (!readModeToggle) return;
        readModeToggle.setAttribute('aria-pressed', readMode ? 'true' : 'false');
        readModeToggle.classList.toggle('border-brass/50', readMode);
        readModeToggle.classList.toggle('bg-brass/15', readMode);
        readModeToggle.classList.toggle('text-brass', readMode);
        readModeToggle.textContent = readMode ? '阅读模式 · 开' : '阅读模式';
    }

    function bindReadMode() {
        applyReadModeChrome();
        if (readModeToggle) {
            readModeToggle.addEventListener('click', () => {
                readMode = !readMode;
                localStorage.setItem('agora.readMode', readMode ? '1' : '0');
                applyReadModeChrome();
                if (lastFeedArticles.length && (currentView === 'timeline' || currentView === 'library')) {
                    renderArticles(lastFeedArticles);
                }
            });
        }
        document.getElementById('readerClose')?.addEventListener('click', closeReader);
        readerOverlay?.querySelectorAll('[data-close-reader]').forEach(el => {
            el.addEventListener('click', closeReader);
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && readerOverlay && !readerOverlay.classList.contains('hidden')) {
                closeReader();
            }
        });
        readerLater?.addEventListener('click', () => {
            if (!readerArticle?.link) return;
            toggleLater(readerArticle.link);
            syncReaderActions();
            if (currentView === 'library') loadArticles(currentPage);
            else if (lastFeedArticles.length) renderArticles(lastFeedArticles);
        });
        readerRead?.addEventListener('click', () => {
            if (!readerArticle?.link) return;
            markRead(readerArticle.link, !isRead(readerArticle.link));
            syncReaderActions();
            if (currentView === 'library') loadArticles(currentPage);
            else if (lastFeedArticles.length) renderArticles(lastFeedArticles);
        });
        readerOpen?.addEventListener('click', () => {
            if (readerArticle?.link) markRead(readerArticle.link, true);
        });
    }

    function syncReaderActions() {
        if (!readerArticle) return;
        const link = readerArticle.link || '';
        readerLater.className = actionBtn(isLater(link));
        readerLater.textContent = '稍后';
        readerRead.className = actionBtn(isRead(link));
        readerRead.textContent = '已读';
    }

    function openReader(article) {
        if (!article || !readerOverlay) return;
        readerArticle = article;
        const link = article.link || '';
        readerTitle.textContent = article.title || '无标题';
        const chips = [
            article.source_cn || article.source,
            article.source_type_label,
            article.domain_label || article.country,
            article.published,
            article.company,
        ].filter(Boolean);
        readerMeta.innerHTML = chips.map(c =>
            `<span class="rounded-full border border-white/10 px-2 py-0.5">${escapeHtml(c)}</span>`
        ).join('');
        const desc = (article.description || '').trim();
        if (desc) {
            readerSummary.textContent = desc;
            readerSummary.classList.remove('hidden');
            readerEmpty.classList.add('hidden');
        } else {
            readerSummary.textContent = '';
            readerSummary.classList.add('hidden');
            readerEmpty.classList.remove('hidden');
        }
        const timeline = buildClusterTimeline(article);
        if (timeline.length > 1) {
            readerRelated.classList.remove('hidden');
            readerRelated.innerHTML = `
                <div class="mb-2 flex items-baseline justify-between gap-2">
                    <div class="font-display text-[11px] uppercase tracking-[0.14em] text-mist-500">同题时间线</div>
                    <div class="text-[11px] text-mist-500">${timeline.length} 家来源 · 按时间</div>
                </div>
                <div class="cluster-timeline">${timeline.map(renderTimelineItem).join('')}</div>`;
            readerRelated.querySelectorAll('[data-reader-open]').forEach(a => {
                a.addEventListener('click', () => markRead(a.dataset.readerOpen, true));
            });
        } else {
            readerRelated.classList.add('hidden');
            readerRelated.innerHTML = '';
        }
        readerOpen.href = link || '#';
        syncReaderActions();
        readerOverlay.classList.remove('hidden');
        readerOverlay.setAttribute('aria-hidden', 'false');
        document.body.classList.add('reader-open');
        document.getElementById('readerClose')?.focus();
    }

    function closeReader() {
        if (!readerOverlay) return;
        readerOverlay.classList.add('hidden');
        readerOverlay.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('reader-open');
        readerArticle = null;
    }

    function clusterTimeMs(item) {
        const ts = item?.published_timestamp;
        if (ts) {
            const ms = Date.parse(ts);
            if (!Number.isNaN(ms)) return ms;
        }
        const pub = item?.published;
        if (pub) {
            const ms = Date.parse(pub);
            if (!Number.isNaN(ms)) return ms;
        }
        return Number.POSITIVE_INFINITY;
    }

    function buildClusterTimeline(article) {
        const primaryLink = article.link || '';
        const items = [
            {
                title: article.title,
                link: primaryLink,
                source: article.source,
                source_cn: article.source_cn,
                published: article.published,
                published_timestamp: article.published_timestamp,
                description: article.description || '',
                country: article.country,
                is_primary: true,
            },
            ...((article.related || []).map(r => ({ ...r, is_primary: false }))),
        ];
        items.sort((a, b) => {
            const da = clusterTimeMs(a);
            const db = clusterTimeMs(b);
            if (da !== db) return da - db;
            return String(a.title || '').localeCompare(String(b.title || ''), 'zh');
        });
        return items;
    }

    function formatTimelineWhen(item) {
        const ts = item.published_timestamp;
        if (ts) {
            const d = new Date(ts);
            if (!Number.isNaN(d.getTime())) {
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const hh = String(d.getHours()).padStart(2, '0');
                const mi = String(d.getMinutes()).padStart(2, '0');
                return `${mm}-${dd} ${hh}:${mi}`;
            }
        }
        return item.published || '时间未知';
    }

    function renderTimelineItem(item) {
        const desc = (item.description || '').trim();
        const src = item.source_cn || item.source || '';
        return `
            <div class="cluster-timeline-item ${item.is_primary ? 'is-primary' : ''}">
                <div class="flex flex-wrap items-baseline gap-x-2 gap-y-0.5 text-[11px] text-mist-500">
                    <time class="font-medium text-brass/90">${escapeHtml(formatTimelineWhen(item))}</time>
                    <span>${escapeHtml(src)}</span>
                    ${item.is_primary ? '<span class="rounded-full border border-brass/35 px-1.5 py-px text-[10px] text-brass">本卡</span>' : ''}
                    ${item.country ? `<span>${escapeHtml(item.country)}</span>` : ''}
                </div>
                <a class="mt-1 block text-sm leading-snug text-mist-100 hover:text-brass" href="${escapeHtml(item.link || '')}" target="_blank" rel="noopener noreferrer" data-reader-open="${escapeHtml(item.link || '')}" data-open-link="${escapeHtml(item.link || '')}">${escapeHtml(item.title || '')}</a>
                ${desc ? `<p class="mt-1 text-xs leading-relaxed text-mist-500">${escapeHtml(desc.length > 220 ? desc.slice(0, 220) + '…' : desc)}</p>` : ''}
            </div>`;
    }

    function clusterTimelineHtml(article, panelId) {
        const timeline = buildClusterTimeline(article);
        if (timeline.length <= 1) return '';
        return `
            <div class="mt-3">
                <button type="button" class="cluster-toggle text-[11px] text-brass/90 hover:text-brass" data-target="${panelId}" aria-expanded="false">同题 ${timeline.length} · 时间线 ▾</button>
                <div id="${panelId}" class="mt-1 hidden">
                    <div class="mb-1 text-[10px] tracking-wide text-mist-500">按发布时间排列，观察各方表述演变</div>
                    <div class="cluster-timeline">${timeline.map(renderTimelineItem).join('')}</div>
                </div>
            </div>`;
    }

    function summaryBlock(description, readerIdx, extraClass = '') {
        const desc = (description || '').trim();
        if (!desc) return '';
        const idxAttr = readerIdx != null ? ` data-reader="${readerIdx}"` : '';
        const sumClass = `article-summary mt-2 text-xs leading-relaxed text-mist-400 line-clamp-2 ${extraClass}`.trim();
        const btnClass = `mt-1 text-[11px] text-brass/80 hover:text-brass ${extraClass}`.trim();
        return `
            <p class="${sumClass}"${idxAttr} data-summary>${escapeHtml(desc)}</p>
            <button type="button" class="${btnClass}"${idxAttr}>展开</button>`;
    }

    function bindReaderTriggers(root, articles) {
        root.querySelectorAll('[data-reader]').forEach(el => {
            el.addEventListener('click', e => {
                e.preventDefault();
                e.stopPropagation();
                const idx = parseInt(el.dataset.reader, 10);
                if (!Number.isNaN(idx) && articles[idx]) openReader(articles[idx]);
            });
        });
    }

    function bindClusterToggles(root) {
        root.querySelectorAll('.cluster-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const panel = document.getElementById(btn.dataset.target);
                if (!panel) return;
                const willOpen = panel.classList.contains('hidden');
                panel.classList.toggle('hidden', !willOpen);
                btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
                btn.textContent = willOpen
                    ? btn.textContent.replace('▾', '▴')
                    : btn.textContent.replace('▴', '▾');
            });
        });
    }

    async function loadEarningsCalendar() {
        calendarBody.innerHTML = `<div class="flex flex-col items-center justify-center py-20 text-mist-400"><div class="spinner"></div><div class="text-sm">加载中</div></div>`;
        try {
            const params = new URLSearchParams({ days: calDays });

            const res = await fetch(`/api/earnings/calendar?${params}`);

        }

    function renderCalCompanies(companies) {
        const chips = [{ label: '全部', count: null, id: 'all' }]
            .concat(companies.slice(0, 24).map(c => ({ label: c.label, count: c.count, id: c.label })));

    function renderPagination(meta) {
        if (!meta || meta.total_pages <= 1) {
            paginationEl.style.display = 'none';
            paginationEl.classList.add('hidden');
            return;
        }
        paginationEl.classList.remove('hidden');
        paginationEl.style.display = 'flex';
        const { page, total_pages, has_prev, has_next } = meta;
        const btn = (label, p, active, disabled) =>
            `<button type="button" data-page="${p}" ${disabled ? 'disabled' : ''}
                class="min-w-[2rem] rounded-lg border px-2.5 py-1.5 text-xs transition ${active ? 'border-brass bg-brass text-ink-950' : 'border-white/10 text-mist-400 hover:border-white/25 hover:text-mist-100'} disabled:opacity-30">${label}</button>`;
        let html = btn('‹', page - 1, false, !has_prev);
        buildPageList(page, total_pages).forEach(p => {
            html += p === '...'
                ? `<span class="px-1 text-mist-600">…</span>`
                : btn(p, p, p === page, false);
        });
        html += btn('›', page + 1, false, !has_next);
        paginationEl.innerHTML = html;
        paginationEl.querySelectorAll('[data-page]').forEach(b => {
            b.addEventListener('click', () => {
                const p = parseInt(b.dataset.page, 10);
                if (p >= 1 && p <= total_pages) {
                    loadArticles(p);
                    scrollToResults();
                }
            });
        });
    }

    function buildPageList(current, total) {
        if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
        const pages = [1];
        if (current > 3) pages.push('...');
        for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) pages.push(i);
        if (current < total - 2) pages.push('...');
        pages.push(total);
        return pages;
    }

    function updateResultInfo(meta) {
        if (!meta || meta.total === 0) { resultInfo.textContent = ''; return; }
        const start = (meta.page - 1) * meta.per_page + 1;
        const end = Math.min(meta.page * meta.per_page, meta.total);
        resultInfo.textContent = `${start}–${end} / ${meta.total}`;
    }

    function formatCachedTime(iso) {
        try {
            const d = new Date(iso);
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        } catch { return '—'; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[m]));
    }

    async function fetchJson(url, options) {
        const res = await fetch(url, options);
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        const text = await res.text();
        if (!ct.includes('application/json')) {
            const hint = text.trimStart().startsWith('<')
                ? '接口返回了网页而不是 JSON（常见原因：服务未重启，或路径 404）'
                : text.slice(0, 120);
            throw new Error(`${res.status} ${url}: ${hint}`);
        }
        let data;
        try {
            data = JSON.parse(text);
        } catch {
            throw new Error(`${res.status} ${url}: JSON 解析失败`);
        }
        if (!res.ok) {
            throw new Error((data && data.error) || `${res.status} ${url}`);
        }
        return data;
    }
